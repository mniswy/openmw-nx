name: Build Switch NRO (GBK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        run: |
          aarch64-none-elf-gcc --version
          echo "DEVKITPRO=$DEVKITPRO"

      - name: Host tools
        run: |
          apt-get update
          apt-get install -y cmake ninja-build python3 python3-pip git curl unzip zip

      - name: Generate GBK table
        run: |
          python3 patch/gen_gbk_table.py components/toutf8/gbk_table.h
          wc -c components/toutf8/gbk_table.h

      - name: Apply GBK patch
        run: |
          python3 patch/apply_gbk_patch.py
          git diff --stat

      - name: Build
        run: |
          chmod +x switch/build.sh
          ./switch/build.sh 2>&1 | tee build.log

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmw-gbk-nro
          path: |
            build-switch/**/*.nro
            build-switch/sdcard/**
            build.log
          if-no-files-found: warn
